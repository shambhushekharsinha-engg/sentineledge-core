name: CI - Intel Physical AI Challenge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test - Simulation Import
        run: python -c 'from simulation.env import BimanualDinnerEnv; print("Env import OK")'

      - name: Smoke test - Policy Import
        run: python -c 'from models.vla_policy import get_policy; m = get_policy(); print("Policy import OK")'

      - name: Smoke test - Metrics Import
        run: python -c 'from scripts.metrics import MetricsLogger; print("Metrics import OK")'
